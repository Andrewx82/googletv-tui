[package]
name = "googletv-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-openssl = "0.6"
openssl = "0.10"
prost = "0.13"
prost-types = "0.13"
bytes = "1.7"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdns-sd = "0.11"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
futures-util = "0.3"

[build-dependencies]
prost-build = "0.13"
